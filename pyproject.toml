[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["minimizer"]

[tool.setuptools.packages.find]
include = ["hypr_screens*"]

[tool.setuptools.package-data]
hypr_screens = ["locales.json", "web/**/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[project]
name = "tuneup"
version = "1.1.0"
description = "Tuneup – the settings app Omarchy is missing"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "GhostTz" },
]
keywords = ["hyprland", "minimizer", "window-manager", "workspace", "tiling"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Desktop Environment :: Window Managers",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
hypr-minimizer = "minimizer:main"
tuneup = "hypr_screens.cli:main"
hypr-screens = "hypr_screens.cli:main"

[project.urls]
Homepage = "https://github.com/SlowlyTz/tuneup"
Repository = "https://github.com/SlowlyTz/tuneup"
Issues = "https://github.com/SlowlyTz/tuneup/issues"
