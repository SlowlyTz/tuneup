<!doctype html>
<html lang="en" data-mode="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tuneup</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/responsive.css">
  <!-- Texts: the app sets them in its language (window.hyprBoot / api.translations()). -->
</head>
<body>
  <div class="app">
    <nav class="nav" aria-label="Sections">
      <header class="nav-head">
        <img class="app-mark" src="img/tuneup.svg" alt="" width="40" height="40">
        <span class="nav-head-text">
          <strong>Tuneup</strong>
          <small>The settings app Omarchy is missing</small>
        </span>
      </header>

      <div class="search" id="search">
        <svg class="i search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.3-4.3"/></svg>
        <input id="search-input" type="search" placeholder="Search a setting" autocomplete="off" spellcheck="false"
               role="combobox" aria-expanded="false" aria-controls="search-results" aria-autocomplete="list"
               aria-label="Search a setting">
        <kbd class="search-hint" aria-hidden="true">Ctrl F</kbd>
        <div class="search-results" id="search-results" role="listbox" aria-label="Search results" hidden></div>
      </div>

      <ul class="nav-list" id="nav-list"></ul>
    </nav>

    <main class="main" id="main" tabindex="-1">
      <div class="page" id="page"></div>
      <div class="applybar" id="applybar" role="region" aria-label="Changes not applied yet" hidden></div>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="popover" id="popover" hidden></div>
  <dialog class="dialog" id="dialog"></dialog>

  <script src="bridge.js"></script>
  <!-- Without the app's bridge (opened in a browser): fake data. Both run before the app (a module). -->
  <script>if (!window.api) document.write('<script src="mock.js"><\/script>');</script>
  <script type="module" src="app.js"></script>
</body>
</html>
