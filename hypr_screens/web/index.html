<!doctype html>
<html lang="en" data-mode="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings</title>
  <link rel="stylesheet" href="app.css">
  <!-- Texts: app.js sets them in the app's language (window.hyprBoot / api.translations()). -->
</head>
<body>
  <div class="app">
    <nav class="nav" aria-label="Sections">
      <header class="nav-head">
        <span class="app-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2.5"/><path d="M9 20h6M12 16v4"/></svg>
        </span>
        <span class="nav-head-text">
          <strong>hypr-screens</strong>
          <small>Settings</small>
        </span>
      </header>

      <div class="search" id="search">
        <svg class="i search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.3-4.3"/></svg>
        <input id="search-input" type="search" placeholder="Search a setting" autocomplete="off" spellcheck="false"
               role="combobox" aria-expanded="false" aria-controls="search-results" aria-autocomplete="list"
               aria-label="Search a setting">
        <kbd class="search-hint" aria-hidden="true">Ctrl F</kbd>
        <div class="search-results" id="search-results" role="listbox" aria-label="Search results" hidden></div>
      </div>

      <ul class="nav-list" id="nav-list"></ul>
    </nav>

    <main class="main" id="main" tabindex="-1">
      <div class="page" id="page"></div>
      <div class="applybar" id="applybar" role="region" aria-label="Changes not applied yet" hidden></div>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="popover" id="popover" hidden></div>
  <dialog class="dialog" id="dialog"></dialog>

  <script src="bridge.js"></script>
  <!-- Without the app's bridge (opened in a browser): fake data. -->
  <script>if (!window.api) document.write('<script src="mock.js"><\/script>');</script>
  <script src="app.js"></script>
</body>
</html>
